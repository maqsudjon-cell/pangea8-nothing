name: build

# The repo is the site: GitHub Pages serves the committed HTML directly from
# main (legacy branch deploy). This workflow does not publish — it proves that
# what is committed is exactly what build.mjs produces, and that every link,
# canonical and hreflang in the output holds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        run: node build.mjs

      - name: Committed output matches the generator
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are stale. Run 'node build.mjs' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Links, canonicals, hreflang
        run: node scripts/check.mjs
