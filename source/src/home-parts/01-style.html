<title>tou.gg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a drawn house in cross-section opens the page (day on the left, night on the right, one project per room),
   a scalloped paper edge, a two-tone headline, an app-window mock of the build log, marquee rows, numbered cases,
   pastel data cards. One warm light theme, on purpose. */
:root {
  --cream: #F3EEE5;
  --paper: #FBF8F3;
  --ink: #1B1712;
  --muted: #8C8378;
  --line: #E4DCCF;
  --accent: #C8552D;     /* weld orange */
  --butter: #F1DE9E;
  --clay: #E8AE93;
  --sage: #CBD7B9;
  --sky: #C4D7E0;
  --night: #1D2340;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 18px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
::selection { background: var(--ink); color: var(--cream); }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: .5rem; font-weight: 500; font-size: .9375rem; padding: .8rem 1.25rem; border-radius: 999px; text-decoration: none; background: var(--ink); color: var(--cream); border: 1px solid var(--ink); transition: transform .2s, background-color .2s; }
.pill:hover { transform: translateY(-2px); }
.pill.ghost { background: var(--paper); color: var(--ink); border-color: var(--line); }
.eyebrow { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* ---------- nav over the sky ---------- */
.nav { position: absolute; inset: 0 0 auto 0; z-index: 5; padding-top: env(safe-area-inset-top, 0px); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1rem; }
.logo { font-family: var(--f-display); font-weight: 650; font-size: 1.4rem; letter-spacing: -.03em; text-decoration: none; color: var(--ink); }
.logo span { color: var(--accent); }
.links { display: flex; gap: .2rem; flex-wrap: wrap; justify-content: flex-end; }
.links a { text-decoration: none; font-size: .9rem; padding: .45rem .8rem; border-radius: 999px; color: var(--ink); background: color-mix(in srgb, var(--paper) 55%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.links a.cta { background: var(--ink); color: var(--cream); }

/* ---------- hero scene ---------- */
.hero { position: relative; height: clamp(360px, 54vw, 780px); overflow: hidden; background: var(--sky); }
.hero svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.edge { position: relative; height: 22px; margin-top: -21px; z-index: 2;
  background: radial-gradient(circle at 50% 100%, var(--cream) 10.5px, transparent 11px) 0 0 / 21px 22px repeat-x; }
.scene .layer { transition: transform .6s cubic-bezier(.2, .7, .2, 1); }
.scene .cloud { animation: drift var(--d, 140s) linear infinite; animation-delay: var(--delay, 0s); }
.scene .poplar { transform-box: fill-box; transform-origin: 50% 100%; animation: sway var(--d, 7s) ease-in-out infinite alternate; }
.scene .star { animation: twinkle var(--d, 3s) ease-in-out infinite alternate; animation-delay: var(--delay, 0s); }
.scene .spark { animation: spark 1.1s ease-out infinite; animation-delay: var(--delay, 0s); }
.scene .torch { animation: flicker .18s steps(2) infinite; }
.scene .lantern { transform-box: fill-box; transform-origin: 50% 0; animation: swing 3.2s ease-in-out infinite alternate; }
.scene .news { animation: scrollup 6s linear infinite; }
.scene .eq rect { transform-box: fill-box; transform-origin: 50% 100%; animation: eq .9s ease-in-out infinite alternate; animation-delay: var(--delay, 0s); }
.scene .bulb { animation: twinkle 1.6s ease-in-out infinite alternate; animation-delay: var(--delay, 0s); }
.scene .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 1.4s ease-in-out infinite alternate; }
.scene .flag { transform-box: fill-box; transform-origin: 0% 50%; animation: flag 2.2s ease-in-out infinite alternate; }
.scene .smoke { animation: smoke 5s ease-out infinite; animation-delay: var(--delay, 0s); }
.scene .typing { animation: typing 1.2s steps(1) infinite; }
.scene .room .hl { opacity: 0; transition: opacity .25s; }
.scene .room .tag { opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; }
.scene .room:hover .hl, .scene .room:focus-visible .hl { opacity: 1; }
.scene .room:hover .tag, .scene .room:focus-visible .tag { opacity: 1; transform: none; }
.scene .room { cursor: pointer; outline: none; }
.scene .night-tint { transition: opacity .8s; }
.hero[data-time="day"] .night-tint, .hero[data-time="day"] .nightonly { opacity: 0; }
.hero[data-time="night"] .day-mask { opacity: 1; }
.scene .day-mask { opacity: 0; transition: opacity .8s; }
.scene .nightonly { transition: opacity .8s; }

@keyframes drift { from { transform: translateX(-420px); } to { transform: translateX(2000px); } }
@keyframes sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
@keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
@keyframes spark { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
@keyframes flicker { 0% { opacity: 1; } 50% { opacity: .55; } }
@keyframes swing { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
@keyframes scrollup { from { transform: translateY(0); } to { transform: translateY(-60px); } }
@keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
@keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(12deg); } }
@keyframes flag { from { transform: skewY(-4deg) scaleX(.94); } to { transform: skewY(4deg) scaleX(1); } }
@keyframes smoke { 0% { transform: translate(0, 0) scale(.6); opacity: .5; } 100% { transform: translate(-10px, -60px) scale(1.6); opacity: 0; } }
@keyframes typing { 50% { opacity: 0; } }
@keyframes rise { from { transform: translateY(.45em); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes marquee { to { transform: translateX(-50%); } }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- intro ---------- */
.intro { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 2rem 3rem; align-items: end; padding-block: clamp(2rem, 5vw, 3.5rem) clamp(2.5rem, 6vw, 4.5rem); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.6rem, 6.2vw, 5.2rem); line-height: .98; letter-spacing: -.035em; margin: 0; }
h1 .w { display: inline-block; animation: rise .8s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 60ms); }
h1 .soft { color: var(--muted); }
h1 button { all: unset; cursor: pointer; border-bottom: 2px dotted currentColor; }
h1 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.side { display: grid; gap: 1rem; justify-items: start; }
.side p { margin: 0; font-size: 1.05rem; max-width: 30rem; }
.side p b { font-weight: 600; }
.faces { display: flex; align-items: center; padding: .3rem; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
.faces span { width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: .7rem; font-weight: 500; border: 2px solid var(--paper); margin-left: -.35rem; }
.faces span:first-child { margin-left: 0; }
.side-row { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
.clock { font-size: .9rem; color: var(--muted); }
.clock b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.clock i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3FAE5A; margin-right: .4rem; animation: twinkle 1.2s ease-in-out infinite alternate; }
</style>
