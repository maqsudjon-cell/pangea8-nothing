<style>
/* ---------- section heads: stencil on steel, a chalk note beside ---------- */
.sec { padding-block: clamp(4.5rem, 10vw, 8rem) 0; }

/* ---------- the grille: every live site behind a welded window grille ---------- */

  background: linear-gradient(90deg, #2B3036, #3A4047 50%, #2B3036); border-radius: 4px; box-shadow: 0 30px 60px -30px #000, inset 0 0 0 1px rgb(255 255 255 / .05); }
.cell { position: relative; display: block; aspect-ratio: 16 / 11; overflow: hidden; text-decoration: none; background: #07080A; isolation: isolate; }
.cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; filter: grayscale(1) brightness(.42) contrast(1.1); transform: scale(1.02); transition: filter .5s, transform .6s; }
.cell:hover img, .cell:focus-visible img { filter: none; transform: scale(1.06); }
.cell::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; transition: opacity .5s;
  background: radial-gradient(ellipse at 50% 110%, rgb(255 140 60 / .0), transparent 60%), linear-gradient(180deg, transparent 45%, rgb(0 0 0 / .85)); }
.cell:hover::after { background: radial-gradient(ellipse at 50% 120%, rgb(255 140 60 / .35), transparent 65%), linear-gradient(180deg, transparent 50%, rgb(0 0 0 / .8)); }
/* the decorative scroll welded in the middle of each pane */
.cell .curl { position: absolute; z-index: 2; left: 50%; top: 50%; width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;

.cell .info { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; padding: .8rem .9rem; display: grid; gap: .1rem; }
.cell .tag { font-family: var(--f-mono); font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--hot); }

.cell:hover span.l, .cell:focus-visible span.l { max-height: 3rem; }
/* weld joints at the corners: they flash once when the grille comes into view */
.grille .joint { position: absolute; z-index: 5; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #5B6168 0 35%, #3A4047 36% 60%, transparent 62%); }
.grille.welding .joint::after { content: ""; position: absolute; inset: -18px; border-radius: 50%; opacity: 0;
  background: radial-gradient(circle, #FFFFFF 0 10%, #FFD27A 22%, rgb(255 122 26 / .5) 45%, transparent 70%); animation: tack .7s ease-out both; animation-delay: var(--d, 0s); }

.spec h3 { font-family: var(--f-stencil); font-weight: 800; font-size: 1.8rem; text-transform: uppercase; letter-spacing: .04em; text-align: center; margin: 0 0 1rem; color: #F2EEE6; text-shadow: 0 1px 0 #000; }

.spec dt, .spec dd { padding: .5rem 0; border-top: 1px solid rgb(0 0 0 / .45); box-shadow: 0 -1px 0 rgb(255 255 255 / .05); }

.chalkline { list-style: none; margin: 0; padding: 0 0 0 1.4rem; border-left: 2px dashed rgb(236 230 218 / .35); display: grid; gap: 1.3rem; }
.chalkline li { position: relative; font-family: var(--f-chalk); font-size: 1.15rem; line-height: 1.3; }

.chalkline time { display: block; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }

.cv-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.5rem; }

.rows { display: grid; }
.rows .r { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; justify-content: space-between; padding: .8rem 0; border-bottom: 1px solid var(--edge); }
.rows .r > span { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

.copy { font: inherit; font-family: var(--f-mono); font-size: .7rem; color: var(--chalk); background: transparent; border: 1px solid var(--edge); border-radius: 3px; padding: .25rem .6rem; cursor: pointer; }

footer { padding-block: 2rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 1.5rem; color: var(--dim); font-size: .85rem; }

.bio p { margin: 0 0 1rem; color: #CFCAC0; font-size: 1.05rem; max-width: 36rem; }

.bio .now { display: flex; gap: .75rem; align-items: baseline; padding: .8rem 1rem; border: 1px solid var(--edge); border-radius: 4px; background: rgb(255 255 255 / .02); font-size: .98rem; }
.bio .now span { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--hot); flex: none; }
.bio .now a { color: var(--chalk); }
.all { margin: 1.5rem 0 0; display: flex; justify-content: center; }
.head .chalk a { color: inherit; }
@media (max-width: 720px) { .about { grid-template-columns: 1fr; } }

/* ---------- reveal (only for things that start below the first screen) ---------- */
.js .rv.pre { opacity: 0; transform: translateY(26px); }
.js .rv { transition: opacity .9s cubic-bezier(.2, .7, .2, 1), transform .9s cubic-bezier(.2, .7, .2, 1); transition-delay: var(--d, 0s); }

}

  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .js .rv.pre, .js .ticket.pre { opacity: 1; transform: none; }
}
</style>
