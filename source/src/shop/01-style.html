<title>tou.gg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Big+Shoulders+Stencil+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=Kalam:wght@400;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the workshop at night. A steel plate with a torch that welds the name, soapstone chalk marks for notes,
   a seam that grows down the page as you scroll, the projects behind a welded window grille, job tickets held by
   magnets, a riveted nameplate for the CV. One dark theme, on purpose: steel under a work lamp. */
:root {
  --steel: #0E1012;      /* the plate */
  --plate: #16191D;      /* a raised plate */
  --edge: #2A2F35;       /* machined edges, bars */
  --chalk: #ECE6DA;      /* text: soapstone on steel */
  --dim: #8B9096;
  --hot: #FF7A1A;        /* weld orange */
  --white-hot: #FFF4D6;
  --straw: #D8B35A;      /* temper colours, as steel cools */
  --temper: #4A6FD1;
  --f-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --f-stencil: "Big Shoulders Stencil Display", "Big Shoulders Display", "Arial Narrow", sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-chalk: "Kalam", "Comic Sans MS", cursive;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; color: var(--chalk); font-family: var(--f-body); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  background-color: var(--steel);
  /* brushed steel: fine horizontal grain over a faint mill-scale mottle */
  background-image:
    repeating-linear-gradient(0deg, rgb(255 255 255 / .012) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 20% 10%, rgb(255 255 255 / .03), transparent 60%),
    radial-gradient(ellipse at 80% 60%, rgb(120 140 160 / .035), transparent 55%);
}
a { color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--hot); color: var(--steel); }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); }
.chalk { font-family: var(--f-chalk); color: var(--chalk); opacity: .85; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; gap: .55rem; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .04em; text-transform: uppercase; padding: .75rem 1.3rem; text-decoration: none; color: var(--steel); background: var(--chalk); border-radius: 4px; position: relative; transition: transform .2s, box-shadow .2s, background-color .2s; }
.btn:hover { background: var(--white-hot); box-shadow: 0 0 0 1px var(--hot), 0 0 28px rgb(255 122 26 / .55); transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--chalk); box-shadow: inset 0 0 0 1.5px var(--edge); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1.5px var(--hot), 0 0 24px rgb(255 122 26 / .35); }

/* ---------- nav ---------- */
.nav { position: absolute; inset: 0 0 auto; z-index: 6; padding-top: env(safe-area-inset-top, 0px); }
.nav .wrap { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-block: 1.1rem; }
.logo { font-family: var(--f-stencil); font-weight: 800; font-size: 1.7rem; letter-spacing: .02em; text-decoration: none; }
.logo span { color: var(--hot); }
.links { display: flex; flex-wrap: wrap; gap: .1rem 1.2rem; justify-content: flex-end; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; }
.links a { text-decoration: none; color: var(--dim); }
.links a:hover { color: var(--chalk); }
.links a.tg { color: var(--hot); }

/* ---------- hero: the plate and the torch ---------- */
.hero { position: relative; min-height: clamp(560px, 100svh, 980px); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 50% at 50% 42%, rgb(255 160 80 / .07), transparent 70%),
    linear-gradient(180deg, transparent 70%, rgb(0 0 0 / .45));
  border-bottom: 1px solid var(--edge); }
.hero canvas#weld { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: crosshair; }
.hero .grid-lines { position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(rgb(236 230 218 / .035) 1px, transparent 1px), linear-gradient(90deg, rgb(236 230 218 / .035) 1px, transparent 1px);
  background-size: 64px 64px; mask: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 75%); -webkit-mask: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 75%); }
.hero-foot { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 1.5rem 3rem; align-items: end; padding-block: 0 clamp(1.5rem, 4vw, 3rem); pointer-events: none; }
.hero-foot a, .hero-foot button { pointer-events: auto; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.4rem, 5.6vw, 4.8rem); line-height: .9; letter-spacing: -.005em; text-transform: uppercase; margin: 0; }
h1 .by { color: var(--dim); }
h1 .night { color: var(--hot); text-shadow: 0 0 22px rgb(255 122 26 / .45); }
.who { margin: 0 0 .9rem; font-size: 1.05rem; color: var(--dim); }
.who b { color: var(--chalk); font-weight: 600; }
.hint { font-family: var(--f-chalk); font-size: 1.15rem; color: var(--chalk); opacity: 0; transition: opacity 1s; margin: .8rem 0 0; }
.hint.on { opacity: .7; }

/* the nameplate with the live seconds */
.plate { pointer-events: auto; justify-self: end; width: min(100%, 26rem); position: relative; padding: 1rem 1.25rem 1.1rem; border-radius: 6px;
  background: linear-gradient(160deg, #3B4148, #23272C 45%, #2E3338); box-shadow: inset 0 1px 0 rgb(255 255 255 / .12), inset 0 -1px 0 rgb(0 0 0 / .6), 0 18px 40px -20px #000; }
.plate::before, .plate::after { content: ""; position: absolute; top: .55rem; width: .55rem; height: .55rem; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9AA1A8, #3A3F45 70%); }
.plate::before { left: .55rem; } .plate::after { right: .55rem; }
.plate .k { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: #A9AFB5; text-align: center; }
.plate .v { font-family: var(--f-mono); font-weight: 500; font-size: clamp(1.7rem, 3.6vw, 2.4rem); text-align: center; letter-spacing: .02em; color: #F2EEE6;
  text-shadow: 0 1px 0 rgb(0 0 0 / .8), 0 -1px 0 rgb(255 255 255 / .15); font-variant-numeric: tabular-nums; margin: .25rem 0; }
.plate .row { display: flex; justify-content: space-between; gap: 1rem; font-family: var(--f-mono); font-size: .68rem; color: #A9AFB5; letter-spacing: .08em; text-transform: uppercase; border-top: 1px solid rgb(0 0 0 / .45); box-shadow: 0 -1px 0 rgb(255 255 255 / .06); padding-top: .55rem; margin-top: .4rem; }
.plate .row b { color: #F2EEE6; font-weight: 500; }

/* ---------- the seam that follows the scroll ---------- */
#seam { position: fixed; left: 0; top: 0; width: 44px; height: 100vh; z-index: 4; pointer-events: none; }
@media (max-width: 900px) { #seam { display: none; } }
</style>
